name: Publier video — TikTok + YouTube + Instagram + Facebook

on:
  push:
    paths:
      - 'videos/*.mp4'
      - 'videos/metadata.json'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: |
          sudo apt-get install -y xvfb
          pip install tiktok-uploader instagrapi Pillow google-api-python-client google-auth-oauthlib requests

      - name: Lire les metadonnees
        id: meta
        run: |
          META="videos/metadata.json"
          if [ ! -f "$META" ]; then
            echo "videos/metadata.json introuvable"
            exit 1
          fi
          VIDEO=$(ls videos/*.mp4 2>/dev/null | head -1)
          if [ -z "$VIDEO" ]; then
            echo "Aucun fichier .mp4 dans videos/"
            exit 1
          fi
          {
            echo "title<<EOF"
            jq -r '.title' $META
            echo "EOF"
            echo "description<<EOF"
            jq -r '.description' $META
            echo "EOF"
            echo "video<<EOF"
            echo "$VIDEO"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          echo "Video: $VIDEO"
          echo "Titre: $(jq -r '.title' $META)"

      - name: Publier sur TikTok
        env:
          TIKTOK_SESSION_ID: ${{ secrets.TIKTOK_SESSION_ID }}
        run: |
          xvfb-run --auto-servernum python scripts/upload_tiktok.py \
            --video "${{ steps.meta.outputs.video }}" \
            --title "${{ steps.meta.outputs.title }}" \
            --description "${{ steps.meta.outputs.description }}"
        continue-on-error: true

      # YouTube desactive pour ce test
      # - name: Publier sur YouTube Shorts

      # Instagram desactive pour ce test
      # - name: Publier sur Instagram Reels

      - name: Publier sur Facebook
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
        run: |
          python scripts/upload_facebook.py \
            --video "${{ steps.meta.outputs.video }}" \
            --title "${{ steps.meta.outputs.title }}" \
            --description "${{ steps.meta.outputs.description }}"
        continue-on-error: true

      - name: Nettoyer apres publication
        run: |
          git config user.email "bot@calibodi.com"
          git config user.name "CaliBodi Bot"
          git rm videos/*.mp4 videos/metadata.json 2>/dev/null || true
          git commit -m "nettoyage automatique apres publication" || true
          git push || true
