name: Publier vidéo — TikTok + YouTube + Instagram + Facebook

on:
  push:
    paths:
      - 'videos/*.mp4'
      - 'videos/metadata.json'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          pip install autotok==2.0.0 instagrapi==2.1.2 google-api-python-client google-auth-oauthlib requests

      - name: Lire les métadonnées
        id: meta
        run: |
          META="videos/metadata.json"
          if [ ! -f "$META" ]; then
            echo "videos/metadata.json introuvable"
            exit 1
          fi
          VIDEO=$(ls videos/*.mp4 2>/dev/null | head -1)
          if [ -z "$VIDEO" ]; then
            echo "Aucun fichier .mp4 dans videos/"
            exit 1
          fi
          {
            echo "title<<EOF"
            jq -r '.title' $META
            echo "EOF"
            echo "description<<EOF"
            jq -r '.description' $META
            echo "EOF"
            echo "video<<EOF"
            echo "$VIDEO"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          echo "Video: $VIDEO"
          echo "Titre: $(jq -r '.title' $META)"

      - name: Publier sur TikTok
        env:
          TIKTOK_SESSION_ID: ${{ secrets.TIKTOK_SESSION_ID }}
        run: |
          python scripts/upload_tiktok.py \
            --video "${{ steps.meta.outputs.video }}" \
            --title "${{ steps.meta.outputs.title }}" \
            --description "${{ steps.meta.outputs.description }}"
        continue-on-error: true

      - name: Publier sur YouTube Shorts
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python scripts/upload_youtube.py \
            --video "${{ steps.meta.outputs.video }}" \
            --title "${{ steps.meta.outputs.title }}" \
            --description "${{ steps.meta.outputs.description }}"
        continue-on-error: true

      - name: Publier sur Instagram Reels
        env:
          INSTAGRAM_SESSION_JSON: ${{ secrets.INSTAGRAM_SESSION_JSON }}
        run: |
          python scripts/upload_instagram.py \
            --video "${{ steps.meta.outputs.video }}" \
            --title "${{ steps.meta.outputs.title }}" \
            --description "${{ steps.meta.outputs.description }}"
        continue-on-error: true

      - name: Publier sur Facebook Reels
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          python scripts/upload_facebook.py \
            --video "${{ steps.meta.outputs.video }}" \
            --title "${{ steps.meta.outputs.title }}" \
            --description "${{ steps.meta.outputs.description }}"
        continue-on-error: true

      - name: Nettoyer après publication
        run: |
          git config user.email "bot@calibodi.com"
          git config user.name "CaliBodi Bot"
          git rm videos/*.mp4 videos/metadata.json 2>/dev/null || true
          git commit -m "🧹 Vidéo publiée — nettoyage automatique" || true
          git push || true
