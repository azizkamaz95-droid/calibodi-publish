name: Publier video — TikTok + YouTube + Instagram + Facebook via Make

on:
  push:
    paths:
      - 'videos/*.mp4'
      - 'videos/metadata.json'
  workflow_dispatch:

concurrency:
  group: file-attente
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        timeout-minutes: 5
        run: |
          # ffmpeg via pip (binaire pret a l'emploi) : le miroir apt d'Ubuntu etait trop lent/bloquant
          pip install google-api-python-client google-auth-oauthlib requests imageio-ffmpeg
          sudo ln -sf "$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          command -v jq >/dev/null 2>&1 || timeout 120 sudo apt-get install -y --no-install-recommends jq
          ffmpeg -version | head -1

      - name: Lire les metadonnees
        id: meta
        run: |
          META="videos/metadata.json"
          if [ ! -f "$META" ]; then
            echo "videos/metadata.json introuvable"
            exit 1
          fi
          VIDEO=$(ls videos/*.mp4 2>/dev/null | grep -v 'instagram_reel' | head -1)
          if [ -z "$VIDEO" ]; then
            echo "Aucun fichier .mp4 dans videos/"
            exit 1
          fi
          NETWORKS=$(jq -r '(.networks // ["youtube","tiktok","instagram","facebook"]) | join(",")' $META)
          {
            echo "networks=$NETWORKS"
            echo "title<<EOF"
            jq -r '.title' $META
            echo "EOF"
            echo "description<<EOF"
            jq -r '.description' $META
            echo "EOF"
            echo "video<<EOF"
            echo "$VIDEO"
            echo "EOF"
            echo "videoname<<EOF"
            basename "$VIDEO"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          echo "Video: $VIDEO"

      - name: Convertir video pour Instagram Reels (9:16, nom propre)
        run: |
          VIDEO="${{ steps.meta.outputs.video }}"
          OUTPUT="videos/instagram_reel.mp4"

          HAS_AUDIO=$(ffmpeg -hide_banner -i "$VIDEO" 2>&1 | grep -c "Audio:" || true)

          if [ "$HAS_AUDIO" -gt 0 ]; then
            ffmpeg -i "$VIDEO" \
              -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=black" \
              -c:v libx264 -crf 23 -preset fast \
              -c:a aac -b:a 128k -ar 44100 \
              -movflags +faststart \
              -t 90 \
              "$OUTPUT"
          else
            ffmpeg -i "$VIDEO" -f lavfi -i anullsrc=r=44100:cl=stereo \
              -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=black" \
              -c:v libx264 -crf 23 -preset fast \
              -c:a aac -b:a 128k \
              -movflags +faststart \
              -shortest -t 90 \
              "$OUTPUT"
          fi

          echo "Converti: $OUTPUT"
          ls -lh "$OUTPUT"

      - name: Diagnostic - caracteristiques des videos
        run: |
          for f in "${{ steps.meta.outputs.video }}" videos/instagram_reel.mp4; do
            echo "=== $f"
            ffmpeg -hide_banner -i "$f" 2>&1 | grep -E "Duration|Stream" || true
            ls -l "$f"
          done
        continue-on-error: true

      - name: Pousser la video convertie vers GitHub
        run: |
          git config user.email "bot@calibodi.com"
          git config user.name "CaliBodi Bot"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git add videos/instagram_reel.mp4
          git commit -m "ajout instagram_reel.mp4" || echo "rien a commiter"
          git push origin main

      - name: Publier sur YouTube Shorts
        if: contains(steps.meta.outputs.networks, 'youtube')
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python scripts/upload_youtube.py \
            --video "${{ steps.meta.outputs.video }}" \
            --title "${{ steps.meta.outputs.title }}" \
            --description "${{ steps.meta.outputs.description }}"
        continue-on-error: true

      - name: Publier sur TikTok via Buffer
        if: contains(steps.meta.outputs.networks, 'tiktok')
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: |
          python scripts/upload_tiktok.py \
            --video "${{ steps.meta.outputs.video }}" \
            --title "${{ steps.meta.outputs.title }}" \
            --description "${{ steps.meta.outputs.description }}"
        continue-on-error: true

      - name: Publier sur Instagram via Buffer (instagram_reel.mp4)
        if: contains(steps.meta.outputs.networks, 'instagram')
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python scripts/upload_instagram.py \
            --video "videos/instagram_reel.mp4" \
            --title "${{ steps.meta.outputs.title }}" \
            --description "${{ steps.meta.outputs.description }}"
        continue-on-error: true

      - name: Notifier Make (Facebook Reels)
        if: contains(steps.meta.outputs.networks, 'facebook')
        env:
          VIDEO_NAME: ${{ steps.meta.outputs.videoname }}
          TITLE: ${{ steps.meta.outputs.title }}
          DESCRIPTION: ${{ steps.meta.outputs.description }}
        run: |
          VIDEO_URL="https://raw.githubusercontent.com/azizkamaz95-droid/calibodi-publish/main/videos/instagram_reel.mp4"   # version 1080x1920 (9:16) exigee par Facebook
          PAYLOAD=$(jq -n --arg u "$VIDEO_URL" --arg t "$TITLE" --arg d "$DESCRIPTION" '{video_url:$u,title:$t,description:$d}')
          echo "Message envoye a Make :"; echo "$PAYLOAD"
          curl -sS -m 60 -w "\nReponse de Make : HTTP %{http_code}\n" -X POST "https://hook.eu1.make.com/tqgfp6mficctfmysxih86imdfegsneag" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
        continue-on-error: true

      - name: Attendre et surveiller (URL de la video + statut Buffer)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: python scripts/debug_watch.py "${{ steps.meta.outputs.videoname }}" 3
        continue-on-error: true

      - name: Nettoyer apres publication
        run: |
          git config user.email "bot@calibodi.com"
          git config user.name "CaliBodi Bot"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git rm videos/*.mp4 videos/metadata.json 2>/dev/null || true
          git commit -m "nettoyage automatique apres publication" || true
          git push origin main || true
